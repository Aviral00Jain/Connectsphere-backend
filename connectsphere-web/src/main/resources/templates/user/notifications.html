<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Notifications</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="container"><h1>Notifications</h1><div class="grid" th:if="${notifications != null}"><div class="card" th:each="notification : ${notifications}"><h3 th:text="${notification['message']}">Notification</h3><p class="muted">Type: <span th:text="${notification['type']}"></span></p></div></div></div></body></html>
