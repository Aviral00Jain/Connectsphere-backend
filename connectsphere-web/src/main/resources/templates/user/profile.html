<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Profile</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="container"><div class="card"><h1 th:text="${profile['fullName']}">Profile</h1><p class="muted">@<span th:text="${profile['username']}"></span></p><p th:text="${profile['bio']}"></p></div><div class="grid" th:if="${posts != null}"><div class="card" th:each="post : ${posts}"><h3 th:text="${post['content']}">Post</h3></div></div></div></body></html>
