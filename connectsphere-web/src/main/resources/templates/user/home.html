<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Home</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="container"><h1>ConnectSphere Web Home</h1><p class="muted">Public posts and trending hashtags rendered through the MVC controller layer.</p><div class="card"><h2>Trending Hashtags</h2><div><span class="pill" th:each="tag : ${hashtags}" th:text="${tag}"></span></div></div><div class="grid" th:if="${posts != null}"><div class="card" th:each="post : ${posts}"><h3 th:text="${post['content']}">Post</h3><p class="muted">Author ID: <span th:text="${post['authorId']}"></span></p></div></div></div></body></html>
