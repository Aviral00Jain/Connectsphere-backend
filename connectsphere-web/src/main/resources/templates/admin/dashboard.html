<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Admin Dashboard</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="container"><h1>Admin Dashboard</h1><div class="card"><h2>Trending Hashtags</h2><div><span class="pill" th:each="tag : ${hashtags}" th:text="${tag}"></span></div></div><div class="card"><h2>Reports</h2><div th:each="report : ${reports}"><p th:text="${report['reason']}">Report</p></div></div><div class="card"><h2>Payments</h2><div th:each="payment : ${payments}"><p th:text="${payment['paymentType']}">Payment</p></div></div></div></body></html>
