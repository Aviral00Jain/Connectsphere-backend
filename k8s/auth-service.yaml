apiVersion: apps/v1
kind: Deployment
metadata:
  name: connectsphere-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: connectsphere-auth
  template:
    metadata:
      labels:
        app: connectsphere-auth
    spec:
      containers:
        - name: auth-service
          image: connectsphere/auth-service:latest
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/auth_db
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://eurekaserver:8761/eureka
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: connectsphere-auth
  ports:
    - port: 8081
      targetPort: 8081
