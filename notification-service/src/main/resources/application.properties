spring.application.name=notification-service
server.port=8086

spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:3306/connectsphere_notification_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=${EUREKA_URL}

notification.email.enabled=${NOTIFICATION_EMAIL_ENABLED}
notification.email.from=${NOTIFICATION_EMAIL_FROM:}
notification.auth-service.base-url=${NOTIFICATION_AUTH_SERVICE_BASE_URL}

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
connectsphere.rabbitmq.notification-exchange=connectsphere.notifications.exchange
connectsphere.rabbitmq.new-follower-queue=connectsphere.notifications.follow-created
connectsphere.rabbitmq.new-follower-routing-key=notification.follow.created

spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

management.endpoints.web.exposure.include=*
logging.file.name=logs/notification-service.log
