spring.application.name=post-service
server.port=8082

spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:3306/post_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=${EUREKA_URL}

comment.service.base-url=${COMMENT_SERVICE_BASE_URL}
auth.admin.base-url=${AUTH_ADMIN_BASE_URL}

management.endpoints.web.exposure.include=*
logging.file.name=logs/post-service.log
