spring.application.name=comment-service
server.port=8083

spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:3306/comment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=${EUREKA_URL}

management.endpoints.web.exposure.include=*
logging.file.name=logs/comment-service.log
