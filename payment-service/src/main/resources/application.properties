spring.application.name=payment-service
server.port=8089

spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:3306/connectsphere_payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=${EUREKA_URL}

management.endpoints.web.exposure.include=*
logging.file.name=logs/payment-service.log

# Razorpay Configuration (replace with your keys from https://dashboard.razorpay.com)
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.currency=${RAZORPAY_CURRENCY}
