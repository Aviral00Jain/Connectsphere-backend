# ============================================================
# SonarQube Configuration for ConnectSphere Platform
# ============================================================
# Usage:
#   1. Start SonarQube:  docker-compose up -d sonarqube
#   2. Open http://localhost:9000 (login: admin/admin)
#   3. Generate a token: My Account > Security > Generate Tokens
#   4. Run analysis on a service:
#      cd <service-dir>
#      mvn clean verify sonar:sonar \
#        -Dsonar.host.url=http://localhost:9000 \
#        -Dsonar.token=<YOUR_TOKEN>
# ============================================================

sonar.host.url=http://localhost:9000

# Project identification
sonar.projectKey=connectsphere
sonar.projectName=ConnectSphere Platform
sonar.projectVersion=1.0.0

# Source configuration
sonar.sourceEncoding=UTF-8
sonar.java.source=17

# Exclusions - files to skip during analysis
sonar.exclusions=\
  **/generated/**,\
  **/target/**,\
  **/node_modules/**,\
  **/*.min.js,\
  **/*.min.css,\
  **/connectsphere-web/**,\
  **/docker/**,\
  **/k8s/**

# Coverage exclusions - classes to exclude from coverage calculations
sonar.coverage.exclusions=\
  **/*Application.java,\
  **/*Config.java,\
  **/*Configuration.java,\
  **/config/**,\
  **/dto/**,\
  **/entity/**,\
  **/model/**,\
  **/exception/**,\
  **/constants/**
