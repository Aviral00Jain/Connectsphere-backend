spring.application.name=auth-service
server.port=8081

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL}

# MySQL
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Google OAuth
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID}

# GitHub OAuth
github.oauth.client-id=${GITHUB_OAUTH_CLIENT_ID:}
github.oauth.client-secret=${GITHUB_OAUTH_CLIENT_SECRET:}

management.endpoints.web.exposure.include=*
logging.file.name=logs/auth-service.log
