spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=${EUREKA_URL}

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

management.endpoints.web.exposure.include=*

# Auth Service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**

# Post Service
spring.cloud.gateway.routes[1].id=post-service
spring.cloud.gateway.routes[1].uri=lb://POST-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/posts/**

# Comment Service
spring.cloud.gateway.routes[2].id=comment-service
spring.cloud.gateway.routes[2].uri=lb://COMMENT-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/comments/**

# Like Service
spring.cloud.gateway.routes[3].id=like-service
spring.cloud.gateway.routes[3].uri=lb://LIKE-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/likes/**

# Follow Service
spring.cloud.gateway.routes[4].id=follow-service
spring.cloud.gateway.routes[4].uri=lb://FOLLOW-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/follows/**

# Notification Service
spring.cloud.gateway.routes[5].id=notification-service
spring.cloud.gateway.routes[5].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/notifications/**

# Media Service
spring.cloud.gateway.routes[6].id=media-service
spring.cloud.gateway.routes[6].uri=lb://MEDIA-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/media/**,/stories/**

# Search Service
spring.cloud.gateway.routes[7].id=search-service
spring.cloud.gateway.routes[7].uri=lb://SEARCH-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/search/**,/hashtags/**

spring.cloud.gateway.routes[8].id=payment-service
spring.cloud.gateway.routes[8].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.routes[8].predicates[0]=Path=/payments/**

# Reports via Post Service
spring.cloud.gateway.routes[9].id=report-service
spring.cloud.gateway.routes[9].uri=lb://POST-SERVICE
spring.cloud.gateway.routes[9].predicates[0]=Path=/reports/**

